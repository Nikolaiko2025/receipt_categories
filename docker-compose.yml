services:
  minio:
    container_name: minio_storage
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: root
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpassword
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  minio-data:
  postgres_data:


