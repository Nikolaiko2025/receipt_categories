services:
  minio:
    container_name: minio_storage
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpassword
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: Nikolai
      POSTGRES_PASSWORD: Kolupaev
      POSTGRES_DB: receipt_categories
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  redis:
    container_name: redis_sessions
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # save нужен, чтобы сессии были видны через cmd: redis-cli KEYS "session:*"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

volumes:
  minio-data:
  postgres_data:
  redis_data:


